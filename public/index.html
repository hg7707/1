<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>决斗场 AI 教练</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button
      id="settings-toggle"
      class="settings-toggle"
      type="button"
      aria-label="显示基本信息和 API 设置"
      aria-controls="settings-panel"
      aria-expanded="false"
    >
      忍
    </button>
    <div id="settings-backdrop" class="settings-backdrop" hidden></div>
    <div class="app">
      <aside id="settings-panel" class="settings" aria-hidden="true">
        <div class="brand">
          <button class="mark settings-close" type="button" aria-label="隐藏基本信息和 API 设置">忍</button>
          <div>
            <strong>决斗场教练</strong>
            <span id="health">检查中</span>
          </div>
        </div>

        <section class="settings-section">
          <h2>基本信息</h2>
          <label>
            当前水平
            <select id="profile-level">
              <option value="beginner">入门</option>
              <option value="intermediate" selected>中阶</option>
              <option value="advanced">高阶</option>
            </select>
          </label>
          <label>
            当前段位
            <input id="profile-rank" value="影级附近" />
          </label>
          <label>
            常用忍者
            <input id="profile-player" value="宇智波佐助" />
          </label>
          <label>
            最近怕打的忍者
            <input id="profile-enemy" value="漩涡鸣人" />
          </label>
          <label>
            我方替身状态
            <select id="profile-player-sub">
              <option value="">未填写</option>
              <option value="我方替身可用">可用</option>
              <option value="我方替身不可用">不可用</option>
              <option value="我方替身冷却中">冷却中</option>
            </select>
          </label>
          <label>
            对方替身状态
            <select id="profile-enemy-sub">
              <option value="">未填写</option>
              <option value="对方替身可用">可用</option>
              <option value="对方替身不可用">不可用</option>
              <option value="对方替身冷却中">冷却中</option>
            </select>
          </label>
          <label>
            我方秘卷
            <input id="profile-secret" placeholder="例如：霸体、散、风杀阵" />
          </label>
          <label>
            我方通灵
            <input id="profile-summon" placeholder="例如：蛤蟆、猿魔、熊猫" />
          </label>
          <label class="wide-field">
            当前战况
            <textarea id="profile-situation" rows="3" placeholder="例如：开局技能空了，对面还有替身，我被压到墙角。"></textarea>
          </label>
        </section>

        <section class="settings-section">
          <h2>API 设置</h2>
          <label class="client-provider-field">
            硅基流动 API key
            <input id="siliconflow-key" type="password" placeholder="sk-..." autocomplete="off" />
          </label>
          <label class="client-provider-field">
            模型
            <input id="siliconflow-model" value="deepseek-ai/DeepSeek-V3.2" list="siliconflow-models" />
          </label>
          <datalist id="siliconflow-models">
            <option value="deepseek-ai/DeepSeek-V3.2"></option>
            <option value="deepseek-ai/DeepSeek-R1"></option>
            <option value="Qwen/Qwen3-32B"></option>
            <option value="Qwen/Qwen2.5-72B-Instruct"></option>
          </datalist>
          <label class="client-provider-field">
            接口地址
            <input id="siliconflow-base-url" value="https://api.siliconflow.cn/v1" />
          </label>
          <div class="setting-actions">
            <button id="save-provider" class="secondary" type="button">保存</button>
            <button id="test-provider" class="secondary" type="button">测试</button>
          </div>
          <p id="provider-status">设置只保存在当前浏览器。</p>
        </section>
      </aside>

      <main class="chat-shell">
        <header class="chat-header">
          <div>
            <h1>决斗场 AI 教练</h1>
            <p>教练会先检索本地知识库，再生成并审查回答；没有依据时会追问，不会硬编具体技能机制。</p>
          </div>
        </header>

        <section id="chat-messages" class="chat-messages" aria-live="polite"></section>

        <div class="quick-actions">
          <button class="prompt-chip chat-sample" data-message="我开局技能空放以后总想继续前压，怎么改？" type="button">技能空放怎么改</button>
          <button class="prompt-chip chat-sample" data-message="我什么时候该交替身？替身后经常没有收益。" type="button">什么时候交替身</button>
          <button class="prompt-chip chat-sample" data-message="我有奥义但总是收不掉，对手替身还在怎么办？" type="button">奥义怎么收尾</button>
        </div>

        <form id="chat-form" class="composer">
          <textarea
            id="chat-input"
            name="message"
            rows="1"
            placeholder="输入你的问题，例如：我被对手压墙角时总乱交替身，下一局该怎么处理？"
          ></textarea>
          <button id="chat-submit" type="submit" aria-label="发送">发送</button>
        </form>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
